name: Lockie
options:
  bundleIdPrefix: app.lockie
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
  xcodeVersion: "26.0"   # marks the project as reviewed by Xcode 26 (no 'Update to recommended settings')

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""            # set your Team in Xcode (Signing & Capabilities) on all 4 targets
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_EMIT_LOC_STRINGS: NO
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO

targetTemplates:
  ScreenTimeExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
    dependencies:
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: DeviceActivity.framework
      - sdk: UserNotifications.framework
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources
        buildPhase: resources
      - path: Products.storekit
        buildPhase: none
    dependencies:
      - target: ShieldConfigurationExt
      - target: ShieldActionExt
      - target: DeviceActivityMonitorExt
      - target: ScreenTimeReportExt
      - target: LockieWidgets
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: DeviceActivity.framework
      - sdk: StoreKit.framework
      - sdk: UserNotifications.framework
      - sdk: MessageUI.framework
      - sdk: SafariServices.framework
      - sdk: WidgetKit.framework
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lockie
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMascot
          UIImageRespectsSafeAreaInsets: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleDefault
        CFBundleURLTypes:
          - CFBundleURLName: app.lockie.ios
            CFBundleURLSchemes:
              - lockie
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.app.lockie.ios
        # iCloud → Key-value storage (progress sync, no accounts). Needs iCloud enabled on the App ID.
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lockie.ios
        PRODUCT_NAME: Lockie
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

  ShieldConfigurationExt:
    templates: [ScreenTimeExtension]
    sources:
      - path: Extensions/ShieldConfigurationExt
    dependencies:
      - sdk: ManagedSettingsUI.framework
    info:
      path: Extensions/ShieldConfigurationExt/Info.plist
      properties:
        CFBundleDisplayName: Lockie Shield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: Extensions/ShieldConfigurationExt/ShieldConfigurationExt.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.app.lockie.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lockie.ios.ShieldConfiguration
        PRODUCT_NAME: ShieldConfigurationExt

  ShieldActionExt:
    templates: [ScreenTimeExtension]
    sources:
      - path: Extensions/ShieldActionExt
    info:
      path: Extensions/ShieldActionExt/Info.plist
      properties:
        CFBundleDisplayName: Lockie Shield Action
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: Extensions/ShieldActionExt/ShieldActionExt.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.app.lockie.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lockie.ios.ShieldAction
        PRODUCT_NAME: ShieldActionExt

  DeviceActivityMonitorExt:
    templates: [ScreenTimeExtension]
    sources:
      - path: Extensions/DeviceActivityMonitorExt
    info:
      path: Extensions/DeviceActivityMonitorExt/Info.plist
      properties:
        CFBundleDisplayName: Lockie Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: Extensions/DeviceActivityMonitorExt/DeviceActivityMonitorExt.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.app.lockie.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lockie.ios.DeviceActivityMonitor
        PRODUCT_NAME: DeviceActivityMonitorExt

  ScreenTimeReportExt:
    templates: [ScreenTimeExtension]
    sources:
      - path: Extensions/ScreenTimeReportExt
    dependencies:
      - sdk: SwiftUI.framework
    info:
      path: Extensions/ScreenTimeReportExt/Info.plist
      properties:
        CFBundleDisplayName: Lockie Report
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    entitlements:
      path: Extensions/ScreenTimeReportExt/ScreenTimeReportExt.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.app.lockie.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lockie.ios.ScreenTimeReport
        PRODUCT_NAME: ScreenTimeReportExt

  LockieWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/LockieWidgets
      - path: Shared/Brand.swift
      - path: Shared/Stats
      - path: Shared/Localizable.xcstrings
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Extensions/LockieWidgets/Info.plist
      properties:
        CFBundleDisplayName: Lockie
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Extensions/LockieWidgets/LockieWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.lockie.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lockie.ios.Widgets
        PRODUCT_NAME: LockieWidgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  AppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Shared/Engine
      - path: Shared/Stats
      - path: Shared/Schedule
      - path: Shared/Brand.swift
      - path: Resources
        buildPhase: resources
    info:
      path: Tests/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lockie.ios.tests
        GENERATE_INFOPLIST_FILE: NO

  ScreenshotTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: App
    info:
      path: UITests/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lockie.ios.screenshots
        TEST_TARGET_NAME: App
        GENERATE_INFOPLIST_FILE: NO

schemes:
  App:
    build:
      targets:
        App: all
        AppTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Products.storekit
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - AppTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  Screenshots:
    build:
      targets:
        App: all
        ScreenshotTests: [test]
    test:
      config: Debug
      targets:
        - ScreenshotTests
