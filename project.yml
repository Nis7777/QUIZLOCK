name: QuizLock
options:
  bundleIdPrefix: com.dinismagina
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""            # set your Team in Xcode (Signing & Capabilities) on all 4 targets
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_EMIT_LOC_STRINGS: NO
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: NO

targetTemplates:
  ScreenTimeExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
    dependencies:
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: DeviceActivity.framework
      - sdk: UserNotifications.framework
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources
        buildPhase: resources
      - path: Products.storekit
        buildPhase: none
    dependencies:
      - target: ShieldConfigurationExt
      - target: ShieldActionExt
      - target: DeviceActivityMonitorExt
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: DeviceActivity.framework
      - sdk: StoreKit.framework
      - sdk: UserNotifications.framework
      - sdk: MessageUI.framework
      - sdk: SafariServices.framework
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: QuizLock
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleDefault
        CFBundleURLTypes:
          - CFBundleURLName: com.dinismagina.quizlock
            CFBundleURLSchemes:
              - quizlock
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.dinismagina.quizlock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dinismagina.quizlock
        PRODUCT_NAME: QuizLock
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

  ShieldConfigurationExt:
    templates: [ScreenTimeExtension]
    sources:
      - path: Extensions/ShieldConfigurationExt
    dependencies:
      - sdk: ManagedSettingsUI.framework
    info:
      path: Extensions/ShieldConfigurationExt/Info.plist
      properties:
        CFBundleDisplayName: QuizLock Shield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: Extensions/ShieldConfigurationExt/ShieldConfigurationExt.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.dinismagina.quizlock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dinismagina.quizlock.ShieldConfiguration
        PRODUCT_NAME: ShieldConfigurationExt

  ShieldActionExt:
    templates: [ScreenTimeExtension]
    sources:
      - path: Extensions/ShieldActionExt
    info:
      path: Extensions/ShieldActionExt/Info.plist
      properties:
        CFBundleDisplayName: QuizLock Shield Action
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: Extensions/ShieldActionExt/ShieldActionExt.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.dinismagina.quizlock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dinismagina.quizlock.ShieldAction
        PRODUCT_NAME: ShieldActionExt

  DeviceActivityMonitorExt:
    templates: [ScreenTimeExtension]
    sources:
      - path: Extensions/DeviceActivityMonitorExt
    info:
      path: Extensions/DeviceActivityMonitorExt/Info.plist
      properties:
        CFBundleDisplayName: QuizLock Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: Extensions/DeviceActivityMonitorExt/DeviceActivityMonitorExt.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.dinismagina.quizlock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dinismagina.quizlock.DeviceActivityMonitor
        PRODUCT_NAME: DeviceActivityMonitorExt

  AppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Shared/Engine
      - path: Resources
        buildPhase: resources
    info:
      path: Tests/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dinismagina.quizlock.tests
        GENERATE_INFOPLIST_FILE: NO

schemes:
  App:
    build:
      targets:
        App: all
        AppTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Products.storekit
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - AppTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
